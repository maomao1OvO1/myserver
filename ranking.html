<!DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<title>五子棋排行榜</title>

<style>

body{
    text-align:center;
    font-family:Arial;
    background:#f5f5f5;
}


.card{

    background:white;

    margin:10px;

    padding:15px;

    border-radius:15px;

    font-size:20px;

    box-shadow:0 3px 10px rgba(0,0,0,0.15);

}

.dev-card{

    border:3px solid #7C5CBF;

    box-shadow:
        0 0 10px #7C5CBF,
        0 0 25px rgba(124,92,191,0.6);

    background:#f3edff;

    animation:devGlow 2s infinite;

}

@keyframes devGlow{

    0%{

        box-shadow:
        0 0 10px #7C5CBF,
        0 0 25px rgba(124,92,191,0.5);

    }


    50%{

        box-shadow:
        0 0 20px #7C5CBF,
        0 0 45px rgba(124,92,191,0.8);

    }


    100%{

        box-shadow:
        0 0 10px #7C5CBF,
        0 0 25px rgba(124,92,191,0.5);

    }

}

</style>

</head>


<body>

<h1>🏆 毛毛游戏平台排行榜</h1>

<p>实时战绩</p>

<div id="list">
加载中...
</div>

<script>

fetch("https://maomao-server.onrender.com/ranking")

.then(res=>res.json())

.then(data=>{

    let html="";

    let games={};


    data.forEach(p=>{

        if(!games[p.game]){

            games[p.game]=[];

        }

        games[p.game].push(p);

    });


    for(let game in games){

        html += `<h2>🎮 ${game}</h2>`;


games[game].sort((a,b)=>{

    if(game=="猜数字"){

        return a.score-b.score;

    }

    return b.score-a.score;

});


games[game].forEach((p,i)=>{

        let medal = ["🥇","🥈","🥉"][i] || "🏅";


html += `

<div class="card ${p.name=="毛毛" ? "dev-card" : ""}">

${medal}

${p.name=="毛毛" ? "👑 " : ""}${p.name}

<br>

${p.score} 分

</div>

`;

    });


    }
     

    document.getElementById("list").innerHTML=html;

});

</script>


</body>

</html>
